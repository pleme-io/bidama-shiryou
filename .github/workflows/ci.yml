name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    uses: pleme-io/substrate/.github/workflows/nix-fleet.yml@main
    with:
      lint: false
      canonical-check: ""
      eval-checks: '["project", "danpen-diff", "heni-mutations"]'
    secrets: inherit
