[package]
name = "shiryou-danpen-diff"
description = "The second implementation of shiryou/toriyose/danpen: apollo-compiler on the same GraphQL corpus, verdicts and canonical prints compared with blue's."
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]
apollo-compiler = "1.33.1"
blue-lang-host = "0.0.195"
blue-lang-pkg = { version = "0.0.195", features = ["embedded", "fixture"] }
blue-lang-runtime = { version = "0.0.195", features = ["sys"] }
